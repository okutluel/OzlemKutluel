<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Özlem Kutluel — CV & Links</title>
  <meta name="description" content="Özlem Kutluel — Digital Transformation and Business Intelligence.">
  <meta property="og:title" content="Özlem Kutluel — CV & Links">
  <meta property="og:description" content="View my CV, connect on LinkedIn, or get in touch.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#321b18">
  <style>
    :root { --chocolate:#321b18; --pink:#f4d7dc; --cream:#fff9f7; --muted:#725a57; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; }
    body {
      margin:0; padding:24px; display:grid; place-items:center;
      background:var(--pink); color:var(--chocolate);
      font-family:Arial,Helvetica,sans-serif;
    }
    main {
      width:min(100%,470px); padding:42px 34px 34px; position:relative; overflow:hidden;
      background:var(--cream); border:1px solid rgba(50,27,24,.16); border-radius:32px;
      box-shadow:0 24px 70px rgba(50,27,24,.16);
    }
    main::before {
      content:""; position:absolute; width:150px; height:150px; right:-78px; top:-78px;
      border-radius:50%; background:var(--pink);
    }
    .mark {
      width:64px; height:64px; margin-bottom:28px; display:grid; place-items:center;
      border-radius:22px; background:var(--chocolate); color:var(--pink);
      font:700 20px Georgia,serif; letter-spacing:.08em;
    }
    h1 {
      max-width:330px; margin:0 0 16px;
      font:500 clamp(2.4rem,9vw,3.6rem)/.96 Georgia,"Times New Roman",serif;
      letter-spacing:-.04em;
    }
    .role {
      margin:0 0 28px; color:var(--muted); font-size:.9rem; line-height:1.5;
      letter-spacing:.13em; text-transform:uppercase;
    }
    .intro { max-width:355px; margin:0 0 34px; font:italic 1.12rem/1.55 Georgia,serif; }
    nav { display:grid; gap:12px; }
    a.button {
      min-height:54px; padding:0 19px; display:flex; align-items:center; justify-content:space-between;
      border-radius:18px; text-decoration:none; font-weight:700; font-size:1rem;
      transition:transform .18s ease,box-shadow .18s ease;
    }
    a.button:hover { transform:translateY(-2px); }
    .primary { background:var(--chocolate); color:var(--cream); box-shadow:0 9px 24px rgba(50,27,24,.15); }
    .secondary { color:var(--chocolate); border:1px solid rgba(50,27,24,.25); }
    .arrow { font-size:1.25rem; }
    footer { margin-top:28px; color:var(--muted); font-size:.85rem; }
    @media (max-width:420px) { main { padding:34px 24px 28px; border-radius:26px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ÖK</div>
    <h1>Özlem Kutluel</h1>
    <p class="role">Digital Transformation · Business Intelligence</p>
    <p class="intro">I turn complex processes and scattered data into systems people can actually use.</p>
    <nav aria-label="Professional links">
      <a class="button primary" href="https://www.linkedin.com/in/ozlem-kutluel/" target="_blank" rel="noopener">Connect on LinkedIn <span class="arrow">↗</span></a>
      <a class="button secondary" href="./Ozlem_Kutluel_CV_Updated.pdf" download>Download my CV <span class="arrow">↓</span></a>
      <a class="button secondary" href="mailto:ozlem.kutluel00@gmail.com">Email me <span class="arrow">→</span></a>
      <a class="button secondary" href="tel:+905365540525">Call me <span class="arrow">→</span></a>
    </nav>
    <footer>Open to international opportunities</footer>
  </main>
</body>
</html>
